name: Public wholesale report probe
on:
  push:
    branches: [main]
    paths: [requests/server-wine-trigger.json]
  workflow_dispatch:
    inputs:
      source:
        description: 'Public quotation source to refresh'
        type: choice
        required: false
        default: '全部'
        options: ['全部', '易茅时价']
  schedule:
    # 07:30 Asia/Shanghai, leaving time before the 08:00 server pickup.
    - cron: '30 23 * * *'
    - cron: '50 1 * * *'
    - cron: '15,40 2 * * *'
    - cron: '20 3 * * *'
permissions:
  contents: write
concurrency:
  group: public-wholesale-probe
  cancel-in-progress: false
jobs:
  read-public-report:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: ${{ fromJSON((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.source == '易茅时价')) && '["易茅时价"]' || '["易茅时价","今日酒价","茅粉鲁智深","国酒酱香"]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate fixed server request
        if: github.event_name == 'push'
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          sha=os.environ['GITHUB_SHA']
          assert event['ref']=='refs/heads/main' and event['after']==sha
          changed=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',sha],text=True).strip()
          assert changed=='requests/server-wine-trigger.json'
          request=json.loads(Path(changed).read_text())
          assert set(request)=={'version','request_id','date','source','requested_at'}
          assert request['version']==1 and request['source']=='易茅时价'
          assert re.fullmatch(r'\d{4}-\d{2}-\d{2}T(?:07:(?:10|30|50)|probe-\d{6})',request['request_id'])
          cn=timezone(timedelta(hours=8)); now=datetime.now(cn)
          requested=datetime.fromisoformat(request['requested_at'])
          assert requested.tzinfo is not None and requested<=now+timedelta(minutes=5)
          assert request['date']==requested.astimezone(cn).date().isoformat()==now.date().isoformat()
          assert request['request_id'].startswith(request['date']+'T')
          PYCODE
      - name: Install fixed public browser runtime
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium firefox
      - name: Read anonymous current publisher report
        env:
          WINE_SOURCE: ${{ matrix.source }}
        run: |
          if [ "$WINE_SOURCE" = "易茅时价" ] || [ "$WINE_SOURCE" = "国酒酱香" ]; then
            xvfb-run -a python3 search_collect.py
          else
            xvfb-run -a python3 collect.py
          fi
      - name: Print bounded public diagnostic
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,base64,hashlib
          from pathlib import Path
          p=Path('result.json')
          if p.exists():
              d=json.loads(p.read_text())
              article=d.pop('article',{})
              d['article_summary']={k:article.get(k) for k in ['source','title','date','source_url','engine','coverage']}
              print(json.dumps(d,ensure_ascii=False))
              raw=p.read_bytes()
              if len(raw)>250000: raise ValueError('public diagnostic size limit')
              encoded=base64.b64encode(raw).decode()
              print('PUBLIC_RESULT_SHA256='+hashlib.sha256(raw).hexdigest())
              for offset in range(0,len(encoded),4000):
                  print('PUBLIC_RESULT_CHUNK='+encoded[offset:offset+4000])
          PYCODE
      - name: Save current public report for independent server validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish.py
