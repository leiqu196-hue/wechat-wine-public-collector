name: Public wholesale report probe
on:
  workflow_dispatch:
  schedule:
    - cron: '50 1 * * *'
    - cron: '15,40 2 * * *'
    - cron: '20 3 * * *'
permissions:
  contents: write
concurrency:
  group: public-wholesale-probe
  cancel-in-progress: false
jobs:
  read-public-report:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: ['今日酒价', '茅粉鲁智深']
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fixed public browser runtime
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium firefox
      - name: Read anonymous current publisher report
        env:
          WINE_SOURCE: ${{ matrix.source }}
        run: xvfb-run -a python3 collect.py
      - name: Print bounded public diagnostic
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json,base64,hashlib
          from pathlib import Path
          p=Path('result.json')
          if p.exists():
              d=json.loads(p.read_text())
              article=d.pop('article',{})
              d['article_summary']={k:article.get(k) for k in ['source','title','date','source_url','engine','coverage']}
              print(json.dumps(d,ensure_ascii=False))
              raw=p.read_bytes()
              if len(raw)>250000: raise ValueError('public diagnostic size limit')
              encoded=base64.b64encode(raw).decode()
              print('PUBLIC_RESULT_SHA256='+hashlib.sha256(raw).hexdigest())
              for offset in range(0,len(encoded),4000):
                  print('PUBLIC_RESULT_CHUNK='+encoded[offset:offset+4000])
          PYCODE
      - name: Save current public report for independent server validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish.py
